name: Checks
permissions:
  contents: read

on:
  pull_request:
    branches:
      - develop
      - trunk
  push:
    branches:
      - develop

jobs:
  lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Lint every PHP file
        run: |
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || status=1
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          exit $status

  tests:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      # No Composer or WordPress needed: tests/bootstrap.php stubs the few WordPress functions used.
      - name: Run the tests
        run: php tests/run.php

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Check what is actually released: .distignore decides what goes into the
      # WordPress.org package, so the development files (.github, .claude, bin, ...)
      # must not be judged as part of the plugin.
      - name: Build the release copy
        run: |
          mkdir -p build/ecom-email-health-check
          rsync -a --exclude '.git' --exclude-from=.distignore ./ build/ecom-email-health-check/

      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: build/ecom-email-health-check
          slug: ecom-email-health-check
