name: Deploy to WordPress.org
on:
  push:
    tags:
      - "*"
jobs:
  tag:
    name: New tag
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v2

      # The deploy action is a Docker action, so GitHub builds its image on every run.
      # Docker Hub sometimes answers that build with a 504 (as it did for 1.3.0),
      # which fails the job before anything reaches WordPress.org. The action is
      # therefore pinned to a release (not @master) and tried up to three times,
      # with a pause between attempts. A real deploy error fails all three the same
      # way, so retrying does not hide it.
      - name: WordPress Plugin Deploy (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: ecom-email-health-check

      - name: Wait before attempt 2
        if: steps.deploy1.outcome == 'failure'
        run: sleep 90

      - name: WordPress Plugin Deploy (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: ecom-email-health-check

      - name: Wait before attempt 3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 240

      - name: WordPress Plugin Deploy (attempt 3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: ecom-email-health-check
