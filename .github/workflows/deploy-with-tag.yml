name: Deploy to WordPress.org
on:
  push:
    tags:
      - "*"
jobs:
  tag:
    name: New tag
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v2

      # The 1.3.0 deploy failed three times because the action was then used as
      # @master, a Docker action whose image build got a 504 from Docker Hub. The
      # action is now pinned to the release 2.3.0 (a composite action that runs a
      # shell script on the runner, with no Docker build). Network hiccups can still
      # fail the job (installing Subversion, talking to the SVN server), so the deploy
      # is tried up to three times with a pause between attempts. A real deploy error
      # fails all three the same way, so retrying does not hide it.
      #
      # Before every retry the working copy of the previous attempt is deleted. The
      # action checks out SVN into $HOME/svn-<slug> and creates tags/<version> there
      # before committing; if attempt 1 died before the commit, that leftover tag
      # directory would make attempt 2 print "already published" and go green
      # without having deployed anything.
      - name: WordPress Plugin Deploy (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: ecom-email-health-check

      - name: Clean up and wait before attempt 2
        if: steps.deploy1.outcome == 'failure'
        run: |
          rm -rf "$HOME/svn-ecom-email-health-check" "$HOME/archivetmp"
          sleep 90

      - name: WordPress Plugin Deploy (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: ecom-email-health-check

      - name: Clean up and wait before attempt 3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: |
          rm -rf "$HOME/svn-ecom-email-health-check" "$HOME/archivetmp"
          sleep 240

      - name: WordPress Plugin Deploy (attempt 3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: ecom-email-health-check

  # After a successful deploy, publish a GitHub release for the tag, with the
  # readme.txt changelog entry of that version as its notes. It runs only if the
  # WordPress.org deploy succeeded, and it does nothing if a release for the tag
  # already exists (for example after a re-run, or one made by hand).
  release:
    name: GitHub release
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release for $TAG already exists; nothing to do."
            exit 0
          fi

          # Older tags used a "v" prefix; the readme.txt headings do not.
          version="${TAG#v}"

          # The lines of "= <version> =" in the Changelog section, up to the next heading.
          awk -v v="$version" '
            /^== Changelog ==/ { in_log = 1; next }
            in_log && /^= .* =$/ { printing = ($0 == "= " v " =") ; next }
            in_log && /^== / { printing = 0 }
            in_log && printing { print }
          ' readme.txt | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes-body.md

          {
            echo "Install or update from WordPress.org: https://wordpress.org/plugins/ecom-email-health-check/"
            echo
            if [ -s notes-body.md ]; then
              cat notes-body.md
            else
              echo "No changelog entry was found for $version in readme.txt."
            fi
          } > release-notes.md

          # A tag with a suffix (2.0.0-beta) is a prerelease and is not marked as the latest release.
          case "$version" in
            *-*) channel="--prerelease" ;;
            *)   channel="--latest" ;;
          esac

          gh release create "$TAG" --verify-tag --title "$version" --notes-file release-notes.md "$channel"
