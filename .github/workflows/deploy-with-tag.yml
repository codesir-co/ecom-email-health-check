name: Deploy to WordPress.org
on:
  push:
    tags:
      - "*"
jobs:
  tag:
    name: New tag
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v2

      # The 1.3.0 deploy failed three times because the action was then used as
      # @master, a Docker action whose image build got a 504 from Docker Hub. The
      # action is now pinned to the release 2.3.0 (a composite action that runs a
      # shell script on the runner, with no Docker build). Network hiccups can still
      # fail the job (installing Subversion, talking to the SVN server), so the deploy
      # is tried up to three times with a pause between attempts. A real deploy error
      # fails all three the same way, so retrying does not hide it.
      #
      # Before every retry the working copy of the previous attempt is deleted. The
      # action checks out SVN into $HOME/svn-<slug> and creates tags/<version> there
      # before committing; if attempt 1 died before the commit, that leftover tag
      # directory would make attempt 2 print "already published" and go green
      # without having deployed anything.
      - name: WordPress Plugin Deploy (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: ecom-email-health-check

      - name: Clean up and wait before attempt 2
        if: steps.deploy1.outcome == 'failure'
        run: |
          rm -rf "$HOME/svn-ecom-email-health-check" "$HOME/archivetmp"
          sleep 90

      - name: WordPress Plugin Deploy (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: ecom-email-health-check

      - name: Clean up and wait before attempt 3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: |
          rm -rf "$HOME/svn-ecom-email-health-check" "$HOME/archivetmp"
          sleep 240

      - name: WordPress Plugin Deploy (attempt 3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: ecom-email-health-check
